core:changelogs:
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update Node.js to 24.22.1 and pnpm to 12.15.0\n\n- Bumped the `devEngines.runtime` and `engines.node` fields to 24.22.1\n- Bumped the `packageManager` and `devEngines.packageManager` fields to pnpm 12.15.0\n"
    filename: 2026-10-21-bright-pines-lift.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update `turbo` to 2.11.10\n"
    filename: 2026-10-21-fresh-otters-race.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update `@oxc-node/cli` to 1.0.0\n\n- Bumped the catalog entry from `0.1.7` to the `1.0.0` release\n"
    filename: 2026-10-21-keen-jays-drum.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update the GitButler agent skill to 0.5.2233\n\n- Bumped the bundled skill version\n- Documented the new `but merge --ff-only` flag\n"
    filename: 2026-10-21-nimble-moons-share.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Pin `@typescript-eslint/types` to 8.72.0\n\n- Updated the `overrides` entry so every `@typescript-eslint` package resolves the same types version\n"
    filename: 2026-10-21-silver-ibex-climb.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n---\n\n## Use Effect string helpers when categorizing Turborepo tasks\n\n- Rewrote the task-category match to use `Predicate.or` with `String.includes` instead of native `String.prototype.includes`\n- Switched the build-time version replacement to `String.replaceAll`\n"
    filename: 2026-10-21-tidy-ravens-mend.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `eslint-plugin-turbo` to 2.11.10\n"
    filename: 2026-10-21-bold-pumas-climb.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `eslint-plugin-storybook` to 10.6.3\n"
    filename: 2026-10-21-neat-swans-listen.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `@eslint-react/eslint-plugin` and `@eslint-react/kit` to 5.28.4\n"
    filename: 2026-10-21-olive-forks-smile.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Require Node.js 24.22.1\n\n- Raised the `engines.node` field to 24.22.1\n- The `settings.node.version` value of the generated ESLint config now reports 24.22.1\n"
    filename: 2026-10-21-quiet-moles-nest.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `eslint-plugin-jsdoc` to 65.4.0\n"
    filename: 2026-10-21-warm-cranes-hurry.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-plugin:\n    type: patch\n---\n\n## Use Effect string helpers inside the lint rules\n\n- Replaced native string calls such as `startsWith`, `replaceAll` and `split` with their `effect/String` counterparts in the Effect rules, the padding-line rule and the shared utils\n"
    filename: 2026-10-21-plain-herons-tidy.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/renovate-config:\n    type: patch\n---\n\n## Update renovate to 44.175.0\n\n- Bumped the `renovate` catalog dependency from 44.171.2 to 44.175.0\n"
    filename: 2026-10-21-tidy-otters-renew.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Update `@opentunnel/client` to 0.5.4\n"
    filename: 2026-10-21-bright-lanterns-glide.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Use Effect string helpers in the Orbit client and OAuth store\n\n- Replaced native string calls with `effect/String` helpers when checking the `text/event-stream` content type, quoting security values, trimming session output and writing the lock file\n- The content-type check now treats a missing header as an empty string\n"
    filename: 2026-10-21-lucky-otters-gather.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: patch\n---\n\n## Update `@effect/tsgo` to 0.56.0\n\n- Bumped the `@effect/tsgo` catalog dependency from 0.54.0 to 0.56.0\n"
    filename: 2026-10-21-quiet-falcons-hover.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: patch\n---\n\n## Enable the `preferEffectString` rule in the Effect preset\n\n- Added `\"preferEffectString\": \"error\"` to `effect.json`, so consumers that extend the preset now get an error when they call native string methods instead of `effect/String` helpers\n"
    filename: 2026-10-21-quiet-strings-guard.md
    v: 0.0.0
