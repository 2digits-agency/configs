    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n  npm:@2digits/oxfmt-config:\n    type: patch\n---\n\n## Update oxfmt to 0.71.0\n"
    filename: 2026-10-03-fresh-ibises-fern.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update turbo to 2.11.7\n\nUpdate repository task orchestration from 2.11.2 to 2.11.7, including SDKROOT forwarding and cache-input handling fixes.\n"
    filename: 2026-10-03-frosty-larks-basil.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update voidzero-dev/setup-vp to 1.21.1\n"
    filename: 2026-10-03-gentle-badgers-fern.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update publint to 0.3.25\n\nUpdate development-only package validation from 0.3.24 to 0.3.25, fixing JSX extension detection and browser-field package references.\n"
    filename: 2026-10-03-lively-moles-spruce.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update @types/node to 24.19.1\n\nUpdate the repository's development-only Node.js type definitions from 24.13.6 to 24.19.1.\n"
    filename: 2026-10-03-mellow-wombats-ash.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update knip to 6.39.0\n\nUpdate repository dependency analysis from 6.37.0 to 6.39.0, adding Turborepo detection and support for Oxlint configuration inheritance.\n"
    filename: 2026-10-03-nimble-puffins-sage.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update baseline-browser-mapping to 2.11.27\n"
    filename: 2026-10-03-silver-puffins-acorn.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update the `@typescript-eslint/types` override from 8.70.0 to 8.71.0\n\nKeep shared TypeScript AST types aligned with the updated parser, scope manager, and rule utilities throughout the workspace.\n"
    filename: 2026-10-03-sprightly-gulls-marble.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Update Effect to 4.0.0\n"
    filename: 2026-10-03-bright-herons-maple.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Update `@effect/platform-node` to 4.0.0\n"
    filename: 2026-10-03-calm-otters-cedar.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Fix Effect 4 module imports\n\n- Replaced removed `effect/unstable` import paths with the Effect 4 entrypoints.\n"
    filename: 2026-10-03-steady-foxes-birch.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Update `@effect/language-service` to 0.87.3\n"
    filename: 2026-10-03-swift-finches-willow.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update eslint-plugin-unicorn to 77.0.0\n\n- Adopted the updated recommended rules and added types for new rules and options.\n- Marked CSS rules moved to `eslint-cssicorn` as deprecated in the rule types.\n"
    filename: 2026-10-03-bold-kingfishers-moss.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `tailwind-csstree` from 0.4.0 to 0.4.1\n\nCSS linting now understands leading and trailing important modifiers in Tailwind `@apply` utilities. Tailwind 4 `@utility` and `@variant` declarations also accept CSS-wide values such as `inherit`, `unset`, and `revert-layer`.\n"
    filename: 2026-10-03-brave-pelicans-agate.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Allow top-level side effects in exported modules\n\n- Disabled `unicorn/no-top-level-side-effects`.\n"
    filename: 2026-10-03-brisk-terns-juniper.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `eslint-plugin-turbo` from 2.11.2 to 2.11.7\n\nRefresh Turborepo environment-variable linting and bundled dependencies while retaining the `turbo/no-undeclared-env-vars` check.\n"
    filename: 2026-10-03-dapper-puffins-ruby.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `eslint-plugin-sonarjs` from 4.2.1 to 4.2.2\n\nRefresh SonarJS rule fixes, including more precise Window message-handler detection, recognition of type imports used by Vue generic script blocks, and dependency lookup when linting from nested directories. The configured rule set is unchanged.\n"
    filename: 2026-10-03-frosty-swans-topaz.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update eslint-plugin-jsdoc to 65.0.2\n\n- Updated rule option types, including `allowNoSpaceAfterAsterisk` for `jsdoc/check-indentation`.\n"
    filename: 2026-10-03-gentle-badgers-maple.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `@tanstack/eslint-plugin-query` from 5.103.2 to 5.104.1\n\nRefresh the Query lint plugin and its declarations without changing its runtime rules or configured defaults.\n"
    filename: 2026-10-03-lively-cranes-amber.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update ESLint from 10.11.0 to 10.12.0\n\nUpdate the configuration's ESLint peer requirement. Enabled core rules gain Unicode identifier fixes, fewer `prefer-arrow-callback` and `no-loss-of-precision` false positives, and a corrected exponentiation autofix for async function expressions.\n"
    filename: 2026-10-03-lucid-thrushes-flint.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `@next/eslint-plugin-next` from 16.3.5 to 16.3.8\n\nAlign the Next.js lint plugin with the latest patch release; its rule implementation is unchanged. This does not update an application's Next.js runtime or apply its security fixes.\n"
    filename: 2026-10-03-mellow-wrens-silver.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Allow asterisk prefixes in documentation comments\n\n- Disabled `unicorn/no-asterisk-prefix-in-documentation-comments`.\n"
    filename: 2026-10-03-merry-dormice-linden.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n  npm:@2digits/eslint-plugin:\n    type: patch\n---\n\n## Update typescript-eslint tooling from 8.70.0 to 8.71.0\n\nUpdate `typescript-eslint`, `@typescript-eslint/parser`, `@typescript-eslint/scope-manager`, and `@typescript-eslint/utils` in the packages that use them at runtime.\n\nThe strict type-checked preset now enables `ts/no-unsafe-enum-assignment`: plain numeric values and unsafe arithmetic assigned to enum-typed locations may produce new errors. Generated configuration types expose the rule; Markdown code blocks keep it disabled with the other type-aware checks.\n"
    filename: 2026-10-03-nimble-ibises-jade.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `eslint-plugin-n` from 18.3.0 to 18.4.1\n\nRefresh Node.js linting with pnpm workspace support in the optional `no-extraneous` rules, corrected import-extension mappings, and cached TypeScript configuration resolution. The configured rule set is unchanged.\n"
    filename: 2026-10-03-placid-robins-opal.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Update eslint-plugin-zod to 5.0.0\n\n- Removed the deprecated `zod/no-string-schema-with-uuid` rule from the ESLint rule types.\n"
    filename: 2026-10-03-quiet-wrens-elm.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `globals` from 17.12.0 to 17.13.0\n\nRecognize `SpeechRecognitionAlternative`, `SpeechRecognitionResult`, and `SpeechRecognitionResultList` as read-only browser globals, avoiding undefined-global errors for these APIs.\n"
    filename: 2026-10-03-serene-starlings-quartz.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update the Node.js target to 24.21.0\n\n- Updated the required Node.js version and the default Node.js lint settings.\n"
    filename: 2026-10-03-soft-pelicans-ash.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `eslint-plugin-storybook` from 10.6.0 to 10.6.1\n\nAlign the Storybook lint plugin with the latest patch release without changing its rule implementation or configured defaults.\n"
    filename: 2026-10-03-sunny-kestrels-pearl.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `@eslint-react/eslint-plugin` and `@eslint-react/kit` from 5.20.5 to 5.23.5\n\n- React checks now catch more props/state rebinding, destructured mutations, aliased impure calls, and render-time ref exposure. `static-components` also follows logical and sequence expressions, so existing code may receive new errors.\n- Directly returning `useState()` from custom hooks is now allowed. Ref-derived state updates and effect cleanup helpers receive fewer false positives; leaked resources are matched by scope rather than variable name.\n- React 19.3 DOM properties are recognized. Async Server Components without a `use client` directive are exempt from purity checks; impure `useRef` initializers remain checked.\n"
    filename: 2026-10-03-vivid-larks-copper.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/opencode-plugin:\n    type: patch\n---\n\n## Update `posthog-node` to 5.55.0\n\nUpdate the analytics dependency from 5.52.5 to 5.55.0. Upstream changes add feature flag runtime and evaluation metadata, fix holdout evaluation and cached flag payload compatibility, and allow disabling automatic flag polling. The plugin continues using the existing event capture APIs.\n"
    filename: 2026-10-03-plugin-posthog-marigold.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/opencode-plugin:\n    type: patch\n---\n\n## Update `@opencode-ai/plugin` to 1.18.34\n\nUpdate the plugin dependency from 1.18.31 to 1.18.34, keeping its OpenCode SDK dependency aligned. Upstream plugin and SDK interfaces are unchanged in this release range.\n"
    filename: 2026-10-03-plugin-sdk-marigold.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Update oxlint to 1.86.0\n\nUpdate the Oxlint peer dependency from 1.84.0 to 1.86.0, including rule correctness fixes and Vite+ configuration discovery changes.\n"
    filename: 2026-10-03-crisp-pandas-hazel.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Update oxlint-tsgolint to 7.0.2003\n\nUpdate the type-aware linting peer dependency from 7.0.2002 to 7.0.2003, including fixes to diagnostics and suggestions.\n"
    filename: 2026-10-03-silver-robins-thyme.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-plugin:\n    type: patch\n---\n\n## Update @oxlint/plugins to 1.86.0\n\nUpdate the runtime plugin compatibility helpers from 1.84.0 to 1.86.0 alongside Oxlint.\n"
    filename: 2026-10-03-misty-geckos-juniper.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/prettier-config:\n    type: patch\n---\n\n## Update prettier to 3.9.9\n\nUpdate the Prettier peer dependency from 3.9.8 to 3.9.9, fixing Markdown text containing dollar signs being incorrectly parsed as math.\n"
    filename: 2026-10-03-golden-newts-clover.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: patch\n---\n\n## Update `@effect/tsgo` to 0.48.0\n"
    filename: 2026-10-03-gentle-badgers-pine.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: patch\n---\n\n## Fix Effect diagnostic configuration\n\n- Removed unsupported options and diagnostic names, and enabled new simplification diagnostics.\n- Kept experimental- and unstable-API notices visible as non-blocking suggestions.\n"
    filename: 2026-10-03-quiet-owls-meadow.md
    v: 0.0.0
