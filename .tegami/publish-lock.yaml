    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update `@eslint/css` to 2.0.1\n\n- Regenerated `css/use-baseline` option types with updated CSS properties, functions, and values, including removal of `punctuation` and `replace` from `text-autospace`\n"
    filename: 2026-10-16-silver-robin-grove.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/opencode-plugin:\n    type: patch\n---\n\n## Update `posthog-node` to 5.56.1\n"
    filename: 2026-10-16-eager-stork-birch.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/opencode-plugin:\n    type: patch\n---\n\n## Update `@opencode-ai/plugin` to 1.19.2\n"
    filename: 2026-10-16-quiet-panda-lantern.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-plugin:\n    type: minor\n  npm:@2digits/oxlint-config:\n    type: minor\n---\n\n## Add `prefer-effect-duration-constants`\n\n- Reported `const` numbers that hold a duration, such as `TIMEOUT_MS = 30_000`, `ONE_DAY = 24 * 60 * 60 * 1000`, or any numeric constant passed to an Effect duration API, and suggested the matching `Duration` constructor\n- Enabled the rule by default in `recommendedRules` and the 2digits Oxlint config, in files that import Effect\n- Extended `prefer-effect-duration` to number arithmetic and more Effect v4 APIs: `Schedule.exponential`, `Schedule.during`, `Stream.debounce`, `Stream.timeout`, `TestClock.adjust`, `Effect.cachedWithTTL`, and the `duration` option of `Effect.timeoutOrElse` and `Stream.throttle`\n"
    filename: 2026-10-13-steady-heron-duration-constants.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Use namespace imports for Effect and OAuth modules\n\n- Replaced barrel imports with direct namespace imports in gateway, Orbit client, and OAuth code without changing runtime behavior\n"
    filename: 2026-10-16-merry-shrew-glade.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Update `@yielded/oauth` to 0.1.0-beta.42\n"
    filename: 2026-10-16-tidy-quail-cedar.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: major\n---\n\n## Reject error payloads that shadow `name`\n\n- Enabled `errorPayloadShadowsName` as an error in `effect.json`, requiring flagged error payload fields to be renamed\n"
    filename: 2026-10-16-azure-weasel-stone.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: major\n---\n\n## Require Effect array helpers\n\n- Enabled `preferEffectArray` as an error in `effect.json`, requiring flagged native array operations to use Effect helpers\n"
    filename: 2026-10-16-copper-toad-hollow.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: major\n---\n\n## Require `Effect.yieldNow` instead of zero-duration sleeps\n\n- Enabled `effectSleepZeroToYieldNow` as an error in `effect.json`; flagged `Effect.sleep(0)` calls now need `Effect.yieldNow`\n"
    filename: 2026-10-16-dawn-puffin-island.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: major\n---\n\n## Require schema-based tagged errors\n\n- Enabled `preferSchemaTaggedError` as an error in `effect.json`, requiring flagged tagged error definitions to use `Schema.TaggedError`\n"
    filename: 2026-10-16-green-ferret-hill.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: major\n---\n\n## Enforce Effect import conventions\n\n- Enabled `preferBarrelImport` and `preferNamespaceImport` as errors in `effect.json`\n- Configured barrel imports for `@effect/vitest` and namespace imports for Effect platform packages, `@yielded/oauth`, `@yielded/jose`, `@yielded/crypto`, and `alchemy`; existing imports may need migration\n"
    filename: 2026-10-16-patient-swan-thistle.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: major\n---\n\n## Require `Effect.tap` for side effects that preserve the original value\n\n- Enabled `flatMapToTap` as an error in `effect.json`, requiring flagged `Effect.flatMap` calls to use `Effect.tap`\n"
    filename: 2026-10-16-polite-jay-stream.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: major\n---\n\n## Require brands on schema classes\n\n- Enabled `schemaClassMissingBrand` as an error in `effect.json`; flagged schema classes now need a unique brand\n"
    filename: 2026-10-16-scarlet-duck-garden.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: major\n---\n\n## Require Effect record helpers\n\n- Enabled `preferEffectRecord` as an error in `effect.json`, requiring flagged native object operations to use Effect helpers\n"
    filename: 2026-10-16-smooth-bison-prairie.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-plugin:\n    type: patch\n---\n\n## Use Effect helpers in lint rules\n\n- Rewrote rule internals to use Effect collection helpers and `Match`, so the plugin's own code follows the Effect rules it ships\n- Replaced duration arithmetic and constant-name parsing with `effect/Number` and `effect/String` helpers\n"
    filename: 2026-10-16-brave-otter-oxlint-effect-helpers.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-plugin:\n    type: patch\n---\n\n## Update `@oxlint/plugins` to 1.88.0\n"
    filename: 2026-10-16-soft-wren-maple.md
    v: 0.0.0
