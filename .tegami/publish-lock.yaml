    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Update `eslint-plugin-zod` to 5.2.0\n\n- Added `default` to the generated ESLint option types for `zod/consistent-import`\n"
