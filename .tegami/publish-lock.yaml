core:changelogs:
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n  npm:@2digits/cli:\n    type: patch\n  npm:@2digits/renovate-config:\n    type: patch\n---\n\n## Run TypeScript scripts with oxnode\n\n- Replaced `tsx` with `@oxc-node/cli` (`oxnode`) for the `@2digits/cli` bin script, the renovate config build script, and the root `tegami` script\n- Removed `tsx` from the catalog\n"
    filename: 2026-09-03-oxnode-swap-scripts.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: minor\n---\n\n## Enforce stricter Effect diagnostics and import aliases\n\n- Enabled the `allOfMapToForEach`, `catchConditionalRefailToCatchIf`, `catchDieToOrDie`, `flatMapConditionalToFilterOrFail`, `mapSomeToAsSome`, and `unsupportedServiceAccessors` diagnostics\n- Added `Equal`, `Predicate`, and `Record` import aliases and disabled the `importFromBarrel` diagnostic\n- Updated the CLI and TLO MCP packages to comply with the new rules\n"
    filename: 2026-09-03-tsconfig-amber-diagnostics.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: minor\n---\n\n## Enforce the raceFirstWithSleepToTimeout diagnostic\n\n- Enabled the `raceFirstWithSleepToTimeout` diagnostic as an error, added in `@effect/tsgo` 0.40.0\n"
    filename: 2026-09-03-tsconfig-racefirst-diagnostic.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Refresh tsdown and turborepo skill references\n\n- Updated the tsdown and tsdown-migrate skill references for the latest release, adding a `copy` option guide and documenting new dependency, log-level, and CLI options\n- Updated the turborepo skill references to 2.10.13, including the `TURBO_SCM_BASE` replacement for `--affected-base` and the `--parallel` deprecation\n"
    filename: 2026-09-03-tsdown-turbo-skills.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update pkg-types to 2.3.2\n"
    filename: 2026-09-03-pkg-types-catalog-bump.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update catalog dependencies\n\n- Updated `@eslint/css` to 2.0.0, `tailwind-csstree` to 0.4.0, and `@effect/tsgo` to 0.39.1\n- Refreshed the generated ESLint rule option types for the updated Effect TypeScript tooling\n"
    filename: 2026-09-03-eslint-frost-catalog-bumps.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update eslint-plugin-storybook to 10.6.0\n"
    filename: 2026-09-03-storybook-plugin-bump.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/opencode-plugin:\n    type: patch\n---\n\n## Update the OpenCode plugin API to 1.18.27\n"
    filename: 2026-09-03-opencode-orbit-api-bump.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-plugin:\n    type: patch\n  npm:@2digits/oxlint-config:\n    type: minor\n---\n\n## Add custom Oxlint rules\n\nAdded a JavaScript plugin with default Effect correctness and API-usage rules, including syntax-safe diagnostics proposed\nfor `@effect/tsgo`.\n\nEffect projects now receive guidance toward the v4 Array, DateTime, Duration, Encoding, FileSystem, Filter, Headers,\nMatch, Path, and Url APIs. Promise thunks must acknowledge Effect's interruption signal, and Effect/Alchemy imports use\nconsistent submodule namespaces and aliases while leaving `@effect/vitest` imports unchanged.\n\nThe FileSystem and Path rules remain opt-in because the existing `@effect/tsgo/nodeBuiltinImport` diagnostic already\nenforces those migrations without duplicate reports.\n\nThe default Oxlint configuration now also catches unsafe Alchemy v2 migrations, runtime configuration, secret, lifecycle,\nand deprecated API patterns.\n"
    filename: 2026-09-01-oxlint-plugin.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/renovate-config:\n    type: patch\n---\n\n## Update Renovate to 44.60.1\n"
    filename: 2026-09-03-renovate-nova-bump.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/renovate-config:\n    type: patch\n---\n\n## Update Renovate to 44.61.1\n"
    filename: 2026-09-03-renovate-psi-bump.md
    v: 0.0.0
