core:changelogs:
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Require Node 26\n\n- Set the Node engine to `26.13.0`\n"
    filename: 2026-10-31-bold-otters-node.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update knip, pkg-pr-new and pnpm\n\n- Updated `knip` to `6.44.1`, `pkg-pr-new` to `0.0.93` and `pnpm` to `12.17.0`\n"
    filename: 2026-10-31-nimble-owl-tooling.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n  npm:@2digits/oxlint-plugin:\n    type: patch\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Update Effect to 4.1.1\n\n- Updated `effect` and `@effect/platform-node` to `4.1.1`\n"
    filename: 2026-10-31-keen-gull-effect.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n  npm:@2digits/eslint-plugin:\n    type: patch\n---\n\n## Update eslint to 10.14.0\n"
    filename: 2026-10-31-brisk-lynx-eslint.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update eslint-plugin-regexp to 3.3.2\n"
    filename: 2026-10-31-calm-wren-regexp.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update tailwind-csstree to 0.4.2\n"
    filename: 2026-10-31-swift-ibis-tailwind.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/opencode-plugin:\n    type: patch\n---\n\n## Update posthog-node to 5.61.1\n"
    filename: 2026-10-31-lucid-puma-posthog.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxlint-plugin\":\n    type: patch\n---\n\n### Recognize Go JSON Schema modifiers\n\nApply `Schema.toCodecGoJson` with `.pipe(...)`, consistently with other Schema modifiers. Generic schemas bounded only by `Schema.Constraint` remain unchanged.\n"
    filename: 2026-10-30-c41d.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tlo-mcp\":\n    type: minor\n---\n\n### Expose only an allowlist of Orbit tools\n\nThe gateway now connects to Orbit with Effect's `McpClient` over MCP 2025-11-25 and forwards only 43 tools for\ntimesheets, time entries, timers, tickets, todos and read-only planning and project lookups. Other Orbit tools are no\nlonger listed or callable through the gateway.\n"
    filename: 2026-10-28-b7c3.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tlo-mcp\":\n    type: patch\n---\n\n### Support Effect 4.1 crypto services\n\nMigrate gateway authentication and OAuth PKCE to Effect's Digest and SecureRandom services, provided explicitly by the Node runtime.\n\nKeep browser authorization URLs redacted in child-process diagnostics using Effect 4.1's redacted argument support.\n"
    filename: 2026-10-30-f41c.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Update @yielded/oauth to 0.1.0-beta.47\n"
    filename: 2026-10-31-sunny-heron-oauth.md
    v: 0.0.0
