core:changelogs:
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update pnpm to 12.16.0\n"
    filename: 2026-10-27-brisk-cedar-otter.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: minor\n---\n\n## Ship a `monorepo-linting` agent skill\n\nThe package now ships an agent skill that explains how to set up fast typed linting in pnpm and Turborepo monorepos: one ESLint config per package, Turborepo caching instead of `eslint --cache`, and how to diagnose slow lint runs.\n\npnpm 12.11 and later links it into your agent skill directories on install once you approve it with `pnpm approve @2digits/eslint-config`, or add this to `pnpm-workspace.yaml`:\n\n```yaml\npermissions:\n  '@2digits/eslint-config':\n    skills: true\n```\n"
    filename: 2026-10-27-swift-lint-skill.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Respect `ts.tsconfigRootDir` for TypeScript files\n\n`.ts` files now use the `tsconfigRootDir` passed in the `ts` options instead of always using `process.cwd()`.\n"
    filename: 2026-10-27-ts-root-dir.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxfmt-config:\n    type: patch\n---\n\n## Update oxfmt to 0.75.0\n"
    filename: 2026-10-27-silver-pine-wren.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: major\n---\n\n### Mirror the ESLint config's factory, built on oxlint-flat-config\n\n`@2digits/oxlint-config` now has the same shape as `@2digits/eslint-config`: the default export\n`twoDigits(options, ...userConfigs)` composes named\n[oxlint-flat-config](https://github.com/liangmiQwQ/oxlint-flat-config) objects (`2digits:javascript`,\n`2digits:typescript/rules`, `2digits:vitest/rules`, ...) and appends your flat config objects after them, so later\nobjects win.\n\n- `ts`, `react`, `vitest` and `zod` are enabled when their package is installed. Pass `true`/`false` or an options\n  object to override; `js`, `ts`, `react`, `vitest` and `zod` accept `overrides` for their rules.\n- Vitest rules apply to test files only, and React rules to `.ts` and `.tsx` files only, like the ESLint config. Both\n  accept `files`.\n- Test globals and the relaxed `no-unused-expressions` now apply to `*.test.ts(x)` and `*.spec.ts(x)` files; the\n  previous glob matched no files. The `vitest.typecheck` setting (option `vitest.typecheck`) now reaches Oxlint.\n\nMigration:\n\n- Replace `withTwoDigits(config)` with `twoDigits(options, ...configs)`.\n- Replace `ignorePatterns: [...]` with `twoDigits({ ignores: { ignores: [...] } })`. Patterns are anchored to the config\n  directory, so write `**/dist` to match at any depth.\n- Replace `overrides: [{ files, rules }]` with separate `{ files, rules }` objects.\n- Drop `plugins` and `categories`; every built-in plugin is enabled and only configured rules run.\n- The `./base` and `./typescript` entry points are removed.\n"
    filename: 2026-10-26-flat-oxlint-preset.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Update oxlint to 1.90.0\n"
    filename: 2026-10-27-amber-finch-grove.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-plugin:\n    type: patch\n---\n\n## Update `@oxlint/plugins` to 1.90.0\n"
    filename: 2026-10-27-quiet-maple-heron.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tsconfig\":\n    type: patch\n---\n\n### Pin the `@effect/tsgo` peer dependency\n\nThe optional `@effect/tsgo` peer dependency now uses the same exact version as the development dependency (0.59.0)\ninstead of `^0.45.0`, so installing the version that `effect.json` targets no longer causes a peer mismatch.\n"
    filename: 2026-10-27-d5ed5c79.md
    v: 0.0.0
