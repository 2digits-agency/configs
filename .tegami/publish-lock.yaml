  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n---\n\n## Use relative setupFiles path in vite config\n\n- Changed `setupFiles` from an absolute `path.join(__dirname, ...)` to a relative `./test/vitest.setup.ts`\n"
