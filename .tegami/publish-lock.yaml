core:changelogs:
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: patch\n  \"@2digits/oxlint-config\":\n    type: patch\n---\n\n### Support Effect tooling annotations in JSDoc\n\nAllow custom tags used by `@effect/tsgo` and `@effect/language-service`, including `@effect-expect-leaking`, while retaining validation of unknown tags and redundant TypeScript annotations.\n"
    filename: 2026-09-07-a71c9e.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxlint-plugin\":\n    type: patch\n---\n\n### Add automatic fixes for six rules\n\nAdd fixes for Effect duration literals, empty Effect callbacks, barrel and namespace imports, Alchemy Worker property names, and Docker placement constraints. Fixes preserve local bindings and skip unsupported or conflicting code.\n"
    filename: 2026-09-07-c8f2a1.md
    v: 0.0.0
