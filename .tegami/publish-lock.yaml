  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update @next/eslint-plugin-next to 16.3.0\n\n- Added the new `next/no-location-assign-relative-destination` rule to Next.js presets and generated rule types\n"
