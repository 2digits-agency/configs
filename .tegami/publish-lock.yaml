core:changelogs:
  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n---\n\n### Fix `--prettier` and `--no-prettier`\n\n`--prettier` now sets up Prettier and `--no-prettier` skips it, as documented. Before, the two flags did the opposite.\n\n### Check ESLint dependencies at the workspace root\n\nWhen run from a workspace subdirectory, `2d --eslint` now checks the root `package.json` for `eslint` and `@2digits/eslint-config`, where it installs them, instead of reinstalling them and warning that dependencies may be missing.\n\n### Use Effect modules across services\n\n- `turbo.json` reads and writes now go through one `TurboConfigService` instead of copies in the ESLint and Turborepo setup.\n- Shared `hasDependency` and `ensureScript` helpers replace repeated dependency and script checks.\n- Task categories and flag handling use `effect/Match`, `Option` and `String` instead of if-chains, and service layers follow the Effect v4 `layer` naming.\n"
    filename: 2026-10-19-cli-effect-cleanup.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update typescript-eslint to 8.72.0\n\n- `@typescript-eslint/parser`, `scope-manager` and `utils` to 8.72.0\n"
    filename: 2026-10-20-deep-sea-cove.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update eslint-plugin-jsdoc to 65.3.15\n"
    filename: 2026-10-20-ember-sky-peak.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update @tanstack/eslint-plugin-query to 5.104.5\n"
    filename: 2026-10-20-frost-leaf-moon.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/opencode-plugin:\n    type: patch\n---\n\n### Fix redaction, error messages and session cleanup\n\n- Objects referenced more than once in tool input or output are no longer replaced with `[Circular]`; only real cycles are.\n- String errors are reported as-is instead of wrapped in JSON quotes.\n- Text parts of user messages are now released when a session's trace is flushed, instead of being kept for the life of the process.\n\n### Share helpers across capture, state and config\n\n- Trace, generation and tool span events share one builder for the common `$ai_*` and custom properties, and one privacy-aware attribute serializer.\n- Custom properties JSON is parsed once instead of twice, and the session window is computed once per plugin instead of on every message.\n"
    filename: 2026-10-19-opencode-plugin-cleanup.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n### Behavior change: consumer config now wins in `withTwoDigits`\n\n`withTwoDigits` now merges consumer configs the way its documentation describes: consumer configuration takes precedence over the 2digits defaults, and later configs take precedence over earlier ones. Lint results change for consumers who rely on either of these:\n\n- **`extends`**: configs listed in a consumer `extends` now override the 2digits presets. They used to be placed before the presets, so a rule set there (for example `curly: 'off'`) was silently overridden by the defaults.\n- **Rules with options set in more than one config**: the later entry now replaces the earlier one. The entries used to be concatenated into one invalid entry such as `['warn', { … }, 'error', { … }]`.\n\nConfigs that pass neither resolve exactly as before.\n"
    filename: 2026-10-19-oxlint-config-merge-precedence.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n### Type every `eslint-plugin-zod` rule\n\nThe rule types now match `eslint-plugin-zod` 5.2: `zod/no-dynamic-schema-value`, `zod/no-function-scoped-schema`, `zod/prefer-map-set-size-over-min-max`, `zod/prefer-nullish`, `zod/prefer-string-length-over-min-max` and `zod/prefer-validate` are declared, the removed `zod/no-string-schema-with-uuid` is gone, `zod/consistent-import` accepts `syntax: 'default'`, and `zod/prefer-top-level-string-formats` accepts its `ignore` option.\n"
    filename: 2026-10-19-oxlint-config-zod-rule-types.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-plugin:\n    type: patch\n---\n\n## Use Effect helpers in rule internals\n\n- Rewrote rule helpers and `utils.ts` to use Effect modules\n- Fixed `consistent-schema-pipe` handling\n"
    filename: 2026-10-20-gentle-rain-stone.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-plugin:\n    type: patch\n---\n\n## Make FileState bindings non-optional\n\n- Removed optional-key handling for `bindings` and `hasEffectImport` so they default via constructor defaults instead of nullable access\n- Updated rule code to access `state.bindings` directly without optional chaining\n- Changed `candidates` from `let` to `const` and use `.clear()` on reset in `preferEffectDurationConstants`\n- Rewrote `typeNamePath` identifier case using `Fn.flow(Struct.get('name'), Arr.make)`\n"
    filename: 2026-10-20-steady-maple-brook.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/renovate-config:\n    type: patch\n---\n\n## Update renovate to 44.171.1\n"
    filename: 2026-10-20-bright-fox-lake.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/renovate-config:\n    type: patch\n---\n\n## Update renovate to 44.171.2\n\n- Bumped the `renovate` catalog dependency from 44.171.1 to 44.171.2\n"
    filename: 2026-10-20-quick-fox-moon.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n### Tidy Effect usage in the gateway, Orbit client and OAuth store\n\n- Shared the Orbit 401/403 handler, the browser command options and the callback query-parameter check instead of copying them.\n- Hoisted gateway and OAuth callback responses, the request body limit and the text encoder so they are no longer rebuilt per request.\n- The credential lock now maps file-system errors with `catchTag` instead of a hand-written error guard.\n"
    filename: 2026-10-19-tlo-mcp-effect-cleanup.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: patch\n---\n\n## Enable schemaClassObjectLiteral rule in effect config\n\n- Added `schemaClassObjectLiteral: error` to the `@effect/language-service` plugin rules in `effect.json`\n"
    filename: 2026-10-20-bright-owls-zen.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: patch\n---\n\n## Update @effect/tsgo to 0.54.0\n"
    filename: 2026-10-20-calm-wolf-dune.md
    v: 0.0.0
