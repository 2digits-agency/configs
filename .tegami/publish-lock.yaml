    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Update eslint-plugin-zod to 5.0.1\n\n- Enabled the `zod/prefer-nullish` and `zod/require-error-message` rules\n- Dropped the Oxlint override for the removed `zod/no-string-schema-with-uuid` rule\n"
    filename: 2026-10-13-lofty-kiwi-zod.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update eslint-plugin-storybook to 10.6.2\n"
