  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update eslint-plugin-jsdoc to 65.2.0\n\n- Added the `ignoreEmptyLines` option to the generated `jsdoc/check-alignment` rule types.\n"
