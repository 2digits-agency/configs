core:changelogs:
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Remove the repository-specific Pitchfork lint exception\n\n- Removed the `toml/spaced-comment` override for `pitchfork.toml` from the root ESLint configuration\n"
    filename: 2026-10-22-fresh-larks-sail.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n  npm:@2digits/oxlint-config:\n    type: patch\n  npm:@2digits/oxlint-plugin:\n    type: patch\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Correct development commands to run repository scripts\n\n- Updated development instructions to use `vpr` so checks, builds and fixes run the intended package scripts instead of Vite+ built-in tasks\n"
    filename: 2026-10-22-gentle-finches-hop.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Remove obsolete OpenCode plugin plans and Amp integration research\n"
    filename: 2026-10-22-soft-wolves-wander.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n---\n\n## Update `nypm` to 0.6.11\n\n- Bumped the `nypm` catalog dependency from 0.6.10 to 0.6.11\n"
    filename: 2026-10-22-neat-cranes-race.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Update `eslint-plugin-zod` to 5.2.1\n\n- Bumped the `eslint-plugin-zod` catalog dependency from 5.2.0 to 5.2.1\n"
    filename: 2026-10-22-silver-moons-listen.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/opencode-plugin:\n    type: patch\n---\n\n## Update `posthog-node` to 5.56.4\n\n- Bumped the `posthog-node` catalog dependency from 5.56.2 to 5.56.4\n"
    filename: 2026-10-22-warm-pines-climb.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/renovate-config:\n    type: patch\n---\n\n## Update renovate to 44.176.2\n\n- Bumped the `renovate` catalog dependency from 44.175.0 to 44.176.2\n"
    filename: 2026-10-22-keen-ibex-renew.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Update `@opentunnel/client` to 0.5.5\n\n- Bumped the `@opentunnel/client` catalog dependency from 0.5.4 to 0.5.5\n"
    filename: 2026-10-22-bold-otters-glide.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Document running the gateway outside this repository\n\n- Replaced repository-specific startup and login commands with `npx @2digits/tlo-mcp` and global installation instructions\n"
    filename: 2026-10-22-bright-herons-drift.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Clarify background gateway setup\n\n- Added supervisor guidance for interactive login, tunnel readiness, failure restarts and clean shutdown\n- Added a standalone Pitchfork configuration and login-start instructions\n"
    filename: 2026-10-22-calm-badgers-roam.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Model the Orbit session as a schema class\n\n- Changed `Session` from a `Schema.Struct` to a `Schema.Class`, so sessions are now created with `Session.make` instead of a plain object literal\n- Moved `updateSession` and `needsRefresh` onto the class as the `Session.update` and `Session.needsRefresh` static methods\n"
    filename: 2026-10-22-quiet-jars-mend.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: patch\n---\n\n## Update TypeScript to 7.1.0-beta\n\n- Bumped the `typescript` catalog dependency from 7.0.2 to 7.1.0-beta\n- The supported peer range `^6.0.3 || ^7.0.2` already covers the new release, so no range change was needed\n"
    filename: 2026-10-22-plain-ravens-hurry.md
    v: 0.0.0
