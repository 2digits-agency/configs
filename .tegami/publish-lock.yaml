    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: minor\n---\n\n### Enable `eslint-plugin-de-morgan`\n\nThe preset now loads `eslint-plugin-de-morgan` as the `boolean` JS plugin, matching the ESLint config, and reports\nnegated conjunctions and disjunctions such as `!(a && b)` with `boolean/no-negated-conjunction` and\n`boolean/no-negated-disjunction`.\n"
    filename: 2026-10-26-de-morgan-oxlint.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-plugin:\n    type: minor\n---\n\n### Add `no-effect-as-on-log`\n\nReports `Effect.as`, `Effect.asSome` and `Effect.asVoid` on `Effect.log*` and `Console.*` log effects, such as\n`Effect.logInfo('ignored').pipe(Effect.as(false))`. Use `Effect.gen` to `yield*` the log and return the value instead.\nThe rule is part of `recommendedRules`.\n"
    filename: 2026-10-26-plain-larks-alder.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tsconfig\":\n    type: patch\n---\n\n### Expand Effect namespace imports\n\nPrefer namespace imports for all public packages in the Alchemy, Effect, and Yielded auth monorepos, keeping the existing barrel-import exception for `@effect/vitest`.\n"
    filename: 2026-10-26-7c9f2a.md
    v: 0.0.0
