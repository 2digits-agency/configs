  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update eslint-plugin-unicorn to 78.0.0\n\n- Enabled the new `unicorn/no-repeated-call-wrappers` rule\n- Added types for the new `unicorn/no-unnecessary-default-arguments` rule\n"
