core:changelogs:
  - content: "---\npackages:\n  \"@2digits/config-monorepo\":\n    type: patch\n---\n\n### Update Vite+, renovate and pkg-pr-new\n\n- Updated `vite-plus` to `1.7.0`, `renovate` to `44.248.0` and `pkg-pr-new` to `0.0.94`\n- Updated the GitButler skill to `0.5.2282`\n"
    filename: 2026-11-17-29df98c6.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/eslint-plugin\":\n    type: patch\n---\n\n### Update `@typescript-eslint` packages to 8.73.0\n\nThe plugin now builds on `@typescript-eslint/utils` and `@typescript-eslint/scope-manager` 8.73.0.\n"
    filename: 2026-11-17-2c45630e.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: minor\n  \"@2digits/oxlint-config\":\n    type: minor\n---\n\n### Ban `Reflect.apply` and `Reflect.get`\n\n`no-restricted-properties` now reports `Reflect.apply` and `Reflect.get`. Call the function directly, and read properties with typed access or after decoding dynamic input into a domain type. `unicorn/prefer-reflect-apply` is turned off, because it recommends `Reflect.apply`.\n"
    filename: 2026-11-16-restrict-reflect-get-apply.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: patch\n---\n\n### Update `typescript-eslint` to 8.73.0 and `eslint-plugin-jsdoc` to 65.4.10\n\nThe config enables typescript-eslint's new `ts/no-unsafe-class-instance-assignment` rule, which reports object literals and other non-instance values used where a class instance is expected.\n"
    filename: 2026-11-17-eb97c835.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/opencode-plugin\":\n    type: patch\n---\n\n### Update `@opencode-ai/plugin` to 1.19.6\n\nThe plugin now builds on `@opencode-ai/plugin` 1.19.6.\n"
    filename: 2026-11-17-4e122f36.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxfmt-config\":\n    type: patch\n---\n\n### Update `oxfmt` to 0.79.0\n\nThe config now expects `oxfmt` 0.79.0.\n"
    filename: 2026-11-17-f1437b2a.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxlint-config\":\n    type: patch\n  \"@2digits/oxlint-plugin\":\n    type: patch\n---\n\n### Update Oxlint to 1.94.0\n\nThe config now expects `oxlint` 1.94.0, and the plugin builds on `@oxlint/plugins` 1.94.0.\n"
    filename: 2026-11-17-e9fd24f1.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxlint-plugin\":\n    type: minor\n---\n\n### Require type arguments on `Function.dual`\n\nAdded `require-dual-type-arguments` to `recommendedRules`. In TypeScript files, it reports every `Function.dual` call without type arguments, including `dual` imported from `effect/Function` and calls that pass an existing function, such as `Fn.dual(2, BigDecimal.divideUnsafe)`. Without type arguments, TypeScript does not check the implementation against an overload annotation on the constant: inline parameters become `any`, and the data-last form returns `any`. Pass both signatures instead:\n\n```ts\nexport const clientOf = Fn.dual<\n  (project: ProjectRef) => (clients: ReadonlyArray<Client>) => ClientRef,\n  (clients: ReadonlyArray<Client>, project: ProjectRef) => ClientRef\n>(2, (clients, project) => …);\n```\n"
    filename: 2026-11-17-require-dual-type-arguments.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tsconfig\":\n    type: patch\n---\n\n### Update `@effect/tsgo` to 0.70.0\n\nThe Effect config now expects `@effect/tsgo` 0.70.0 and enables its two new diagnostics as errors:\n\n- `flatMapProvideServiceToProvideServiceEffect` suggests `Effect.provideServiceEffect` when a `flatMap` or `andThen` callback only forwards its parameter to `Effect.provideService`\n- `forLoopPushToForEach` suggests `Effect.forEach` instead of a `for-of` loop that pushes yielded Effect results into an array\n\nIt also drops the `debug` option, which 0.70.0 no longer supports.\n"
    filename: 2026-11-17-d41a6dde.md
    v: 0.0.0
