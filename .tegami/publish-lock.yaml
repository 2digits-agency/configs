core:changelogs:
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: patch\n---\n\n### Update ESLint plugins\n\n- Updated `eslint-plugin-jsdoc` to 65.4.4 and `eslint-plugin-storybook` to 10.6.6.\n"
    filename: 2026-11-06-189760b0.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/opencode-plugin\":\n    type: patch\n---\n\n### Update PostHog Node SDK\n\n- Updated `posthog-node` to 5.63.1.\n"
    filename: 2026-11-06-a484cdab.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxfmt-config\":\n    type: patch\n---\n\n### Update Oxfmt\n\n- Updated `oxfmt` to 0.77.0.\n"
    filename: 2026-11-06-03580ac9.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxlint-config\":\n    type: patch\n  \"@2digits/oxlint-plugin\":\n    type: patch\n---\n\n### Update Oxlint\n\n- Updated `oxlint` and `@oxlint/plugins` to 1.92.0 and `oxlint-tsgolint` to 7.0.2006.\n"
    filename: 2026-11-06-261f18f0.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxlint-config\":\n    type: minor\n---\n\n### Enable new type-aware TypeScript rules\n\n- Enabled `typescript/no-unsafe-enum-assignment`, which reports plain numbers or strings used where an enum value is expected.\n- Enabled `typescript/no-generated-empty-object-type`, which reports utility types that resolve to `{}`, such as `Omit<T, keyof T>`.\n"
    filename: 2026-11-06-3ee32e89.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tsconfig\":\n    type: patch\n---\n\n### Update Effect tsgo\n\n- Updated `@effect/tsgo` to 0.67.4.\n"
    filename: 2026-11-06-953a76e2.md
    v: 0.0.0
