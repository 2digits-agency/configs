core:changelogs:
  - content: "---\npackages:\n  \"@2digits/config-monorepo\":\n    type: patch\n---\n\n### Update pnpm, turbo, tsrs and renovate\n\n- Updated `pnpm` to `12.20.0`, `turbo` to `2.11.11`, `tsrs` to `0.24.0-ts7.1.0-beta` and `renovate` to `44.235.3`\n- Updated the GitButler skill to `0.5.2275`\n"
    filename: 2026-11-12-6abebb2c.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: patch\n  \"@2digits/config-monorepo\":\n    type: patch\n---\n\n### Require Node 26.13.1\n\nThe Node engine is now `26.13.1`, and the eslint config's `node.version` setting follows it.\n"
    filename: 2026-11-12-9fa1f507.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: patch\n---\n\n### Update `@eslint-react` and `eslint-plugin-turbo`\n\nThe config now uses `@eslint-react/eslint-plugin` and `@eslint-react/kit` 5.30.2 and `eslint-plugin-turbo` 2.11.11.\n"
    filename: 2026-11-12-bf5e2951.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/opencode-plugin\":\n    type: patch\n---\n\n### Update `posthog-node` to 5.70.0\n\nThe plugin now sends telemetry with `posthog-node` 5.70.0.\n"
    filename: 2026-11-12-1bed84df.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/prettier-config\":\n    type: patch\n---\n\n### Update `prettier` to 3.10.1\n\nThe config now expects `prettier` 3.10.1.\n"
    filename: 2026-11-12-e4839fb4.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tsconfig\":\n    type: patch\n---\n\n### Enable the `onExitFailureToOnError` Effect diagnostic\n\nThe Effect config now reports `onExitFailureToOnError` as an error. It flags `Effect.onExit` callbacks that only act on failure, where `Effect.onError` says the same thing directly.\n"
    filename: 2026-11-12-54d5e723.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tsconfig\":\n    type: patch\n---\n\n### Update `@effect/tsgo` to 0.68.1\n\nThe config now expects `@effect/tsgo` 0.68.1.\n"
    filename: 2026-11-12-8017a0f4.md
    v: 0.0.0
