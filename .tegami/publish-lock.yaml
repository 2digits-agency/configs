core:changelogs:
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n  npm:@2digits/cli:\n    type: patch\n  npm:@2digits/constants:\n    type: patch\n  npm:@2digits/eslint-config:\n    type: patch\n  npm:@2digits/eslint-plugin:\n    type: patch\n  npm:@2digits/opencode-plugin:\n    type: patch\n  npm:@2digits/oxfmt-config:\n    type: patch\n  npm:@2digits/oxlint-config:\n    type: patch\n  npm:@2digits/oxlint-plugin:\n    type: patch\n  npm:@2digits/prettier-config:\n    type: patch\n  npm:@2digits/renovate-config:\n    type: patch\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Type-check with tsrs\n\n- Type checks now run on [tsrs](https://github.com/oxc-project/tsrs) 0.18.0, the Rust port of the TypeScript 7 compiler, instead of `tsc` and `tsgo`.\n- `effect-tsgo patch --tsrs` now patches tsrs on install, so type checks still report Effect diagnostics.\n"
    filename: 2026-10-25-brisk-kites-poplar.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Update baseline-browser-mapping to 2.11.33\n"
    filename: 2026-10-26-crisp-falcons-ash.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/config-monorepo:\n    type: patch\n---\n\n## Migrate dependency build approvals to permissions\n\n- Replaced `allowBuilds` with per-package `permissions` in `pnpm-workspace.yaml`.\n- Disabled builds for `core-js-pure`, `protobufjs`, and `re2`, and removed explicit approvals for `@parcel/watcher` and `better-sqlite3`.\n"
    filename: 2026-10-26-gentle-ravens-pine.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/cli:\n    type: patch\n---\n\n## Remove the unused Effect language service dependency\n\n- Removed `@effect/language-service` from CLI development dependencies and its Knip exclusion.\n"
    filename: 2026-10-26-lucky-finches-beech.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update eslint-plugin-drizzle to 1.0.0-rc.5\n"
    filename: 2026-10-26-bright-herons-cedar.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update eslint-plugin-storybook to 10.6.4\n"
    filename: 2026-10-26-calm-foxes-willow.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update @tanstack/eslint-plugin-query to 5.105.0\n"
    filename: 2026-10-26-quiet-otters-maple.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update graphql-config to 6.0.0\n"
    filename: 2026-10-26-swift-robins-birch.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: patch\n  npm:@2digits/oxlint-plugin:\n    type: patch\n---\n\n### Fix three misleading lint results\n\n- The default `2digits/padding-line-between-statements` options no longer require a blank line between grouped `case` clauses. `--fix` used to split `case 'a':` from `case 'b':`, which then failed `no-fallthrough`.\n- `2digits/avoid-data-tagged-error` now recommends `Schema.TaggedError`; Effect 4 does not export `Schema.TaggedErrorClass`.\n- `2digits/no-effect-alchemy-barrel-imports` no longer treats SCREAMING_SNAKE values such as `ALCHEMY_DEV` as modules, so it stops suggesting and autofixing to the nonexistent `alchemy/ALCHEMY_DEV`.\n"
    filename: 2026-10-26-steady-wrens-oak.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tlo-mcp:\n    type: patch\n---\n\n## Update @yielded/oauth to 0.1.0-beta.46\n"
    filename: 2026-10-26-mellow-badgers-elm.md
    v: 0.0.0
