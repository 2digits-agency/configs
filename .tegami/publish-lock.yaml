    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/opencode-plugin:\n    type: patch\n---\n\n## Update `@opencode-ai/plugin` to 1.18.21\n"
    filename: 2026-08-22-nimble-herons-plugin.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/opencode-plugin:\n    type: patch\n---\n\n## Update `posthog-node` to 5.50.0\n"
    filename: 2026-08-22-quick-jays-posthog.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: major\n---\n\n## Remove the opt-in Effect oxlint preset\n\n- Dropped the `@2digits/oxlint-config/effect` entrypoint (`effectConfig` and `effectConfigFor`).\n- Those rules needed an Oxlint binary patched by `effect-tsgo`; that path is no longer supported. Remove the import and drop `--oxlint` from `effect-tsgo patch`.\n"
    filename: 2026-08-19-silent-foxes-effect.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Update `oxlint` to 1.79.0\n\n- Enable all 22 category-specific React Compiler rules with Oxlint's native implementation.\n- Projects may now report diagnostics from compiler categories that upstream leaves disabled.\n"
    filename: 2026-08-19-solid-hawks-oxlint.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Turn off `prefer-destructuring`\n"
    filename: 2026-08-22-sandy-larks-destructure.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Enable `node/exports-style` and `node/no-mixed-requires`\n\n- `node/exports-style` now errors with `module.exports`.\n- `node/no-mixed-requires` is now an error.\n"
    filename: 2026-08-22-tidy-newts-node.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxfmt-config:\n    type: patch\n---\n\n## Update `oxfmt` to 0.64.0\n\n- Set `experimentalOperatorPosition` to `end` now that oxfmt supports the option.\n"
    filename: 2026-08-19-quiet-elks-oxfmt.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/renovate-config:\n    type: patch\n---\n\n## Update `renovate` to 44.39.2\n"
    filename: 2026-08-19-warm-shrews-renovate.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/renovate-config:\n    type: patch\n---\n\n## Update `renovate` to 44.39.3\n"
