core:changelogs:
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: patch\n---\n\n### Update ESLint React to 5.30.6\n\nThe config now uses `@eslint-react/eslint-plugin` and `@eslint-react/kit` 5.30.6.\n"
    filename: 2026-11-24-68e8261c.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: patch\n  \"@2digits/eslint-plugin\":\n    type: patch\n---\n\n### Update the ESLint toolchain\n\nUpdated typescript-eslint to 8.74.0, the TanStack Query plugin to 5.108.4, the JSDoc plugin to 65.5.4, and the GraphQL\nESLint plugin to 5.0.0.\n"
    filename: 2026-11-24-c55d2117.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/opencode-plugin\":\n    type: patch\n---\n\n### Update PostHog to 6.0.6\n\nThe telemetry integration now uses `posthog-node` 6.0.6.\n"
    filename: 2026-11-24-1c818e44.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxfmt-config\":\n    type: patch\n  \"@2digits/oxlint-config\":\n    type: patch\n  \"@2digits/oxlint-plugin\":\n    type: patch\n---\n\n### Update Oxfmt and Oxlint\n\nUpdated Oxfmt to 0.80.0, Oxlint and its plugin API to 1.95.0, and the type-aware linter to 7.0.2008.\n"
    filename: 2026-11-24-e8df4252.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tsconfig\":\n    type: patch\n  \"@2digits/oxlint-plugin\":\n    type: patch\n---\n\n### Allow named imports from Effect Atom packages\n\n`@effect/atom`, `@effect/atom-react`, `@effect/atom-solid` and `@effect/atom-vue` are no longer in the Effect language\nservice's `namespaceImportPackages`, so `import { useAtomValue } from '@effect/atom-react'` no longer reports\n`preferNamespaceImport`. The `no-effect-alchemy-barrel-imports` and `prefer-effect-alchemy-namespace-imports` oxlint\nrules also leave imports from `@effect/atom*` alone, as they already did for `@effect-atom/*`.\n"
    filename: 2026-11-21-a7c3e91f0b42.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/renovate-config\":\n    type: patch\n---\n\n### Group ESLint React updates\n\nRenovate now groups updates to packages under `@eslint-react`. Major updates can still get a separate pull request.\n"
    filename: 2026-11-24-7e5fe3dc.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tsconfig\":\n    type: patch\n---\n\n### Update Effect TypeScript tooling\n\nUpdated `@effect/tsgo` to 0.73.4.\n"
    filename: 2026-11-24-acd456d0.md
    v: 0.0.0
