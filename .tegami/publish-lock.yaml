core:changelogs:
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: minor\n---\n\n### Lint shell scripts\n\n- Added `@eslint/shell` with its recommended rules for `*.sh` and `*.bash` files, parsed as Bash. Shell code blocks in Markdown are not linted.\n"
    filename: 2026-11-08-1a3c8aec.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: patch\n---\n\n### Require `_id` selections in GraphQL operations\n\n- `gql/require-selections` now also checks `_id`, the identifier field Prepr uses. Types with only `id` still require `id`. A type with both fields passes when either one is selected.\n"
    filename: 2026-11-08-4d9e2b17.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: patch\n---\n\n### Update ESLint plugins\n\n- Updated `@tanstack/eslint-plugin-query` to 5.107.1 and `eslint-plugin-jsdoc` to 65.4.5.\n"
    filename: 2026-11-08-5e1d7a42.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/eslint-config\":\n    type: minor\n  \"@2digits/oxlint-config\":\n    type: minor\n---\n\n### Report numbers used as booleans\n\n- Enabled `strict-boolean-expressions` (`ts/` in ESLint, `typescript/` in Oxlint) with `allowNumber: false` and `allowNullableNumber: false`. It reports conditions like `if (count)`, `if (str.indexOf(x))` and `items.length && <List />`, where `0` (or `NaN`) is a valid value but reads as `false`. Compare explicitly instead, for example `count !== 0`, `str.includes(x)` or `items.length > 0`.\n- Strings, `any` and nullable strings, booleans, enums and objects are still allowed. The rule also reports conditions on objects that are never nullish and on unions of different kinds of values, such as `string | number`.\n- Projects that are not ready can turn the rule off with `overrides` on the `ts` options.\n"
    filename: 2026-11-08-e2f15369.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxlint-config\":\n    type: minor\n---\n\n### Add native React web accessibility checks\n\n- Added an opt-in `react.web` profile with 15 native accessibility rules and DOM property validation, including a narrow `cmdk-input-wrapper` exception. Web checks inherit the React file scope and support separate file patterns and overrides for mixed web/native repositories.\n- Enabled `react/no-unstable-nested-components` for React with `allowAsProps: true`, preserving translation callbacks and render props alongside the existing React Compiler checks.\n"
    filename: 2026-11-08-66bf078a.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/oxlint-plugin\":\n    type: minor\n---\n\n### Report millisecond arithmetic and millisecond-typed parameters\n\n- Added `no-millis-arithmetic`, which reports arithmetic and comparisons on `Duration.toMillis(...)`, `DateTime.toEpochMillis(...)`, `Clock.currentTimeMillis` results and `*Ms`/`*Millis` bindings, and names the `Duration` or `DateTime` function to use instead.\n- Added `prefer-effect-duration-types`, which reports `*Ms`/`*Millis` parameters and fields typed as `number` or decoded with `Schema.Number`, and suggests `Duration.Input`, `Duration.Duration`, `Schema.DurationFromMillis` or `Schema.Duration`. Callbacks of non-Effect APIs and ambient declarations are skipped.\n"
    filename: 2026-11-08-be59f9e6.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@2digits/tsconfig\":\n    type: patch\n---\n\n### Update Effect tsgo\n\n- Updated `@effect/tsgo` to 0.67.5.\n"
    filename: 2026-11-08-b83f0c19.md
    v: 0.0.0
