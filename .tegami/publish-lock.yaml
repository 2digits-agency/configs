core:changelogs:
  - content: "---\npackages:\n  npm:@2digits/eslint-config:\n    type: patch\n---\n\n## Update @tanstack/eslint-plugin-query to 5.105.3\n"
    filename: 2026-11-03-amber-lynx-shelf.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/oxlint-config:\n    type: patch\n---\n\n## Allow `it.live` in Vitest test blocks\n\n- Added `it.live` to `additionalTestBlockFunctions` for `vitest/expect-expect` and `vitest/no-standalone-expect`\n"
    filename: 2026-11-03-pale-finch-ember.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: patch\n---\n\n## Update @effect/tsgo to 0.64.1\n"
    filename: 2026-11-03-quiet-heron-dune.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@2digits/tsconfig:\n    type: patch\n---\n\n## Update Effect language-service diagnostics\n\n- Added `effectSucceedWithUndefined`, `effectTryWithoutCatch`, `globalJson`, `globalJsonInEffect`, `mapSomeCatchNoSuchElement`, `matchBooleanToIsSuccess`, `provideMergeAllToArray`, `resultMatchToFromResult`, `suspendFailToFailSync`, `typeUnionToSchemaUnion` and `yieldInCallArgument` diagnostics\n- Removed `preferSchemaOverJson` diagnostic\n- Added `brandedSchemaClasses` for `Class`, `TaggedClass`, `Error`, `TaggedError` and `Opaque`\n- Added `taggedClass` naming rule for `default` pattern, skipping the `src/` path prefix\n"
    filename: 2026-11-03-rapid-cedar-plum.md
    v: 0.0.0
