name: ✉️ Tegami PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  preview:
    name: 📝 Release preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 🗃️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚡Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true

      - name: 📝 Generate release preview
        run: vp run tegami pr preview --artifact tegami-pr-preview.md

      - name: 📤 Upload release preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tegami-pr-preview
          path: tegami-pr-preview.md
