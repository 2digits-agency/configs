overrides:
  '@opentunnel/client>effect': 'catalog:'
  '@opentunnel/protocol>effect': 'catalog:'
  baseline-browser-mapping: 2.11.39
  '@typescript-eslint/types': 8.74.0
  eslint-plugin-sonarjs>typescript: 'catalog:eslint'
  eslint-plugin-zod>typescript: 'catalog:eslint'
  globalthis: npm:@nolyfill/globalthis@1.0.44
  safe-buffer: npm:@nolyfill/safe-buffer@1.0.44
  safer-buffer: npm:@nolyfill/safer-buffer@1.0.44
  side-channel: npm:@nolyfill/side-channel@1.0.44
  vite: 'catalog:'

packageExtensions:
  # The Zod plugin also brings typescript-eslint into the TypeScript 7 Oxlint package.
  eslint-plugin-zod:
    dependencies:
      typescript: '*'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

catalogMode: strict
cleanupUnusedCatalogs: true
minimumReleaseAge: 0
optimisticRepeatInstall: true
preferWorkspacePackages: true
savePrefix: ''
verifyDepsBeforeRun: warn

catalogs:
  # typescript-eslint still requires the TypeScript 6 compiler API.
  eslint:
    typescript: 6.0.3

permissions:
  core-js-pure:
    build: false
  dtrace-provider:
    build: true
  esbuild:
    build: true
  eslint-vitest-rule-tester:
    skills: true
  msgpackr-extract:
    build: false
  protobufjs:
    build: false
  re2:
    build: false
